name: Manual Test Run

on:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (only Chromium)
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Run UI tests
        run: npm run tests:ui -- --reporter=html --project=chromium
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-ui

      - name: Run API tests
        run: npm run tests:api -- --reporter=html
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-api

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: playwright-report-ui/
          retention-days: 7

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report-api/
          retention-days: 7